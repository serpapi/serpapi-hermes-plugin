name: Publish release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out the released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.30"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  live:
    name: Live SerpApi integration
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY || secrets.SERPAPI_KEY }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY || secrets.SERPAPI_API_KEY }}

    steps:
      - name: Check out the released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.30"
          python-version: "3.14"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Require the SerpApi repository secret
        shell: bash
        run: |
          if [[ -z "${SERPAPI_API_KEY}" && -z "${SERPAPI_KEY}" ]]; then
            echo "Add SERPAPI_API_KEY or SERPAPI_KEY as a GitHub Actions repository secret." >&2
            exit 1
          fi

      - name: Test real web, Maps, News, and Shopping responses
        run: uv run pytest -m live

  build:
    name: Build release distributions
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the released revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.30"
          python-version: "3.14"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Verify release tag matches the package version
        shell: bash
        run: |
          package_version="$(uv version --short)"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must equal v${package_version}." >&2
            exit 1
          fi

      - name: Build wheel and source distribution
        run: uv build

      - name: Check package metadata
        run: uv run twine check dist/*

      - name: Upload release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  verify-distributions:
    name: Verify built distributions
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.30"
          python-version: "3.14"
          enable-cache: true

      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-distributions
          path: dist/

      - name: Test the built wheel
        run: uv run --isolated --no-project --with 'pytest>=8.3,<10' --with ./dist/*.whl pytest

      - name: Test the source distribution
        run: uv run --isolated --no-project --with 'pytest>=8.3,<10' --with ./dist/*.tar.gz pytest

  publish:
    name: Publish to PyPI
    needs: [verify-distributions, live]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/serpapi-hermes-plugin
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-distributions
          path: dist/

      - name: Publish distributions with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
