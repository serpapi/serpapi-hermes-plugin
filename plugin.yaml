name: serpapi
version: 1.2.0
requires_hermes: ">=0.21.6"
description: "SerpApi web, Maps, News, Shopping, Hotels, Flights, Travel Explore, and page extraction for Hermes Agent. Scrape pages, map URLs, or crawl sites."
author: SerpApi
license: MIT
homepage: https://github.com/serpapi/serpapi-hermes-plugin
kind: backend
provides_web_providers:
  - serpapi
provides_tools:
  - serpapi_maps_search
  - serpapi_news_search
  - serpapi_shopping_search
  - serpapi_hotels_search
  - serpapi_flights_search
  - serpapi_travel_explore_search
  - serpapi_extract
requires_env:
  - name: SERPAPI_API_KEY
    description: "API key for SerpApi search and extraction"
    url: "https://serpapi.com/manage-api-key"
    secret: true
